<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T.B.E</title>
<style>
*{box-sizing:border-box}body{background:#0d0d0d;color:#fff;font:16px Arial;margin:0;padding:20px}main{max-width:480px;margin:auto}.head{text-align:center;margin:25px}.card{background:#1b1b1b;border-radius:18px;padding:20px;margin:15px 0}.tabs{display:flex;gap:8px}button,input{width:100%;padding:14px;margin-top:10px;border-radius:12px;font-size:16px}button{border:0;background:#fff;color:#111;font-weight:bold}.tabs button{background:#333;color:#fff}.tabs .active{background:#fff;color:#000}.hidden{display:none}.muted{color:#aaa}.msg{white-space:pre-wrap;overflow-wrap:anywhere}.balance{font-size:40px;font-weight:bold}h2{margin-top:0}
</style></head><body><main>
<header class="head"><h1>T.B.E</h1><p class="muted">Trading British Essentials</p></header>
<section id="auth" class="card"><div class="tabs"><button id="st" class="active" type="button">Sign In</button><button id="lt" type="button">Log In</button></div>
<form id="sf"><h2>Create account</h2><input id="un" placeholder="Username (3–20 letters/numbers/_)" pattern="[A-Za-z0-9_]{3,20}" minlength="3" maxlength="20" required><input id="se" type="email" placeholder="Email" required><input id="sp" type="password" placeholder="Password (6+ characters)" minlength="6" required><button id="sb">Create account</button></form>
<form id="lf" class="hidden"><h2>Log In</h2><input id="le" type="email" placeholder="Email" required><input id="lp" type="password" placeholder="Password" required><button>Log In</button></form><p id="am" class="msg muted"></p></section>
<section id="panel" class="hidden">
<div class="card"><p class="muted">CURRENT BALANCE</p><div class="balance" id="bal">0 TOKENS</div><p>Username: <b id="name"></b></p><p id="mail" class="muted"></p><button id="out">Log Out</button></div>
<div class="card"><h2>Send TOKENS</h2><form id="send"><input id="recipient" placeholder="Recipient username" required><input id="amount" type="number" min="1" step="1" placeholder="Amount" required><button>Send TOKENS</button></form><p id="sm" class="msg muted"></p></div>
<div class="card"><h2>Promo Codes</h2><p class="muted">Enter a promo code to redeem TOKENS.</p><form id="promo"><input id="promoCode" placeholder="Promo code" required><button>Redeem code</button></form><p id="pm" class="msg muted"></p></div>
<div id="admin" class="card hidden"><h2>Admin Panel</h2><p class="muted">Give all accounts the configured TOKENS amount.</p><form id="giveAll"><input id="giveAmount" type="number" min="1" step="1" placeholder="TOKENS per account" required><button>Give All Tokens</button></form><p id="adm" class="msg muted"></p></div>
</section><p id="gm" class="msg muted"></p></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,doc,getDoc,runTransaction,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import{getFunctions,httpsCallable}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-functions.js";
const cfg={apiKey:"AIzaSyCEaG4EyH0OKkh2_S6soveMESAhWGOB3aQ",authDomain:"tbe-trademarket-currency.firebaseapp.com",databaseURL:"https://tbe-trademarket-currency-default-rtdb.firebaseio.com",projectId:"tbe-trademarket-currency",storageBucket:"tbe-trademarket-currency.firebasestorage.app",messagingSenderId:"923411460993",appId:"1:923411460993:web:91aa0b1ac209789b1f6e80",measurementId:"G-TK3ZVPJCX0"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),functions=getFunctions(app),$=id=>document.getElementById(id);
const call=name=>httpsCallable(functions,name);let busy=false;
function tab(t){$("sf").classList.toggle("hidden",t!=="s");$("lf").classList.toggle("hidden",t!=="l");$("st").classList.toggle("active",t==="s");$("lt").classList.toggle("active",t==="l");$("am").textContent=""}
$("st").onclick=()=>tab("s");$("lt").onclick=()=>tab("l");
function error(e){const code=e.code||"";return({"auth/email-already-in-use":"Email already registered. Please log in.","auth/invalid-credential":"Wrong email or password.","auth/weak-password":"Choose a stronger password.","permission-denied":"Firebase permissions blocked this action.","functions/not-found":"The secure Firebase functions have not been deployed yet.","functions/unauthenticated":"Please log in again."})[code]||e.message||"Something went wrong."}
$("sf").onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$("sb").disabled=true;let cred;try{const username=$("un").value.trim(),key=username.toLowerCase();cred=await createUserWithEmailAndPassword(auth,$("se").value.trim(),$("sp").value);await runTransaction(db,async tx=>{const nr=doc(db,"Usernames",key),ur=doc(db,"Users",cred.user.uid);if((await tx.get(nr)).exists())throw Error("USERNAME_TAKEN");tx.set(nr,{uid:cred.user.uid});tx.set(ur,{username,usernameKey:key,email:cred.user.email,balance:0,infinite:false,role:"user",createdAt:serverTimestamp(),redeemed:[]})});$("sf").reset();$("am").textContent="Account created."}catch(x){$("am").textContent=x.message==="USERNAME_TAKEN"?"That username is already taken.":error(x)}finally{busy=false;$("sb").disabled=false}};
$("lf").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("le").value.trim(),$("lp").value);$("lf").reset()}catch(x){$("am").textContent=error(x)}};
async function refresh(u){const s=await getDoc(doc(db,"Users",u.uid));if(!s.exists())throw Error("Your account profile is missing. Contact support before creating another account.");const d=s.data();$("name").textContent=d.username||"—";$("mail").textContent=u.email||"";$("bal").textContent=d.infinite?"INF TOKENS":Number(d.balance||0).toLocaleString()+" TOKENS";$("admin").classList.toggle("hidden",d.role!=="admin");}
onAuthStateChanged(auth,async u=>{if(!u){$("auth").classList.remove("hidden");$("panel").classList.add("hidden");return}try{await refresh(u);$("auth").classList.add("hidden");$("panel").classList.remove("hidden")}catch(x){$("gm").textContent=error(x)}});
$("out").onclick=()=>signOut(auth);
$("send").onsubmit=async e=>{e.preventDefault();$("sm").textContent="Sending…";try{const r=await call("sendTokens")({recipientUsername:$("recipient").value.trim(),amount:Number($("amount").value)});$("sm").textContent=r.data?.message||"TOKENS sent.";e.target.reset();await refresh(auth.currentUser)}catch(x){$("sm").textContent=error(x)}};
$("promo").onsubmit=async e=>{e.preventDefault();$("pm").textContent="Checking code…";try{const r=await call("redeemPromo")({code:$("promoCode").value.trim()});$("pm").textContent=r.data?.message||"Code redeemed.";e.target.reset();await refresh(auth.currentUser)}catch(x){$("pm").textContent=error(x)}};
$("giveAll").onsubmit=async e=>{e.preventDefault();$("adm").textContent="Processing…";try{const r=await call("giveAllTokens")({amount:Number($("giveAmount").value)});$("adm").textContent=r.data?.message||"All accounts updated.";await refresh(auth.currentUser)}catch(x){$("adm").textContent=error(x)}};
</script></body></html>
